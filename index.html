<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Design Viewer</title>
</head>
<body>

    <div>
        <!-- এআই ডিজাইন ইমেজ দেখানোর জন্য -->
        <img id="designImage" src="" alt="AI Generated Design" style="max-width: 100%; border-radius: 8px;" />
        
        <!-- পণ্যের বিবরণ বা প্রম্পট দেখানোর জন্য -->
        <p id="productDetails">Loading design...</p>
    </div>

    <script>
        const rawUrl = "https://raw.githubusercontent.com/jounayada-creator/ai-app-project/refs/heads/main/data/design.json";

        fetch(rawUrl)
            .then(response => response.json())
            .then(data => {
                // গিটহাবের JSON থেকে imageUrl বসাবে
                document.getElementById('designImage').src = data.imageUrl;
                
                // গিটহাবের JSON থেকে productDetails বা বিবরণ বসাবে
                document.getElementById('productDetails').innerText = data.productDetails;
            })
            .catch(error => {
                console.error('Error fetching design:', error);
                document.getElementById('productDetails').innerText = 'Failed to load design.';
            });
    </script>

</body>
</html>
